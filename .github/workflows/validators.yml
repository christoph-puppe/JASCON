# Runs the reference validators on every change to what they read.
#
# Four jobs, one per implementation and one for the pages:
#   python      validate_core.py, the reference (Ubuntu, Python 3.12), and the
#               tests of the converter library (test_oscal_conv_lib.py)
#   powershell  validate_core.ps1, the twin, on WINDOWS POWERSHELL 5.1
#               (windows-latest; `shell: powershell` is 5.1, `pwsh` would be 7)
#   app         the JavaScript port in jascon-app/ against the same vectors
#   browser     the app's pages and the pack builder (one-page-apps/) in
#               Chromium, driven by Playwright, their output held to the
#               reference validator
#
# Each job fails unless its validator ends ALL GREEN. The counts are written
# to the job summary, so a run is a dated record of what passed where
# (specification IV.5b item 3: the second implementation).
name: Validators

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "jascon/**"
      - "converted_examples/**"
      - "jascon-app/**"
      - "one-page-apps/**"
      - ".gitattributes"
      - ".github/workflows/validators.yml"
  pull_request:
    paths:
      - "jascon/**"
      - "converted_examples/**"
      - "jascon-app/**"
      - "one-page-apps/**"
      - ".gitattributes"
      - ".github/workflows/validators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the validator's one dependency
        run: pip install jsonschema
      - name: validate_core.py
        run: |
          set -o pipefail
          python jascon/scripts/validate_core.py | tee run.log
      - name: Converter library (the value-level measurement of the coverage reports)
        run: python jascon/scripts/test_oscal_conv_lib.py
      - name: Summary
        if: always()
        run: |
          {
            echo '### validate_core.py'
            echo '```'
            grep -E '^  [a-z-]+: [0-9]+ pass|: [0-9]+ pass, [0-9]+ fail|^ALL GREEN|FAILURES' run.log | cut -c1-160
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  powershell:
    name: PowerShell twin (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion.ToString()
          Write-Host "Windows PowerShell $v, edition $($PSVersionTable.PSEdition)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host 'not Windows PowerShell 5.x'; exit 1 }
      - name: validate_core.ps1
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File jascon\scripts\validate_core.ps1 | Tee-Object -FilePath run.log
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion.ToString()
          $lines = @("### validate_core.ps1 on Windows PowerShell $v", '```')
          if (Test-Path run.log) {
            $lines += Get-Content run.log | Where-Object { $_ -match ': \d+ pass, \d+ fail|^ALL GREEN|FAILURES|wall-clock' } | ForEach-Object { if ($_.Length -gt 160) { $_.Substring(0, 160) } else { $_ } }
          }
          $lines += '```'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  app:
    name: JavaScript port (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generated files are current
        run: |
          node jascon-app/tools/gen-schema.mjs --check
          node jascon-app/tools/gen-docs.mjs --check
          node jascon-app/tools/check-i18n.mjs
          node one-page-apps/tools/sync-inlined.mjs --check
      - name: Test suite
        run: node --test "jascon-app/tests/*.test.mjs"

  browser:
    name: Pages in a browser (app and pack builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The validator's one dependency, Playwright and Chromium
        run: |
          pip install jsonschema
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node --test jascon-app/tests/pages.test.mjs "one-page-apps/tests/*.test.mjs"
