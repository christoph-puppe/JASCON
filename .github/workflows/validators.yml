# Runs the reference validators on every change to what they read.
#
# Four jobs, one per implementation and one for the pages:
#   python      validate_core.py, the reference (Ubuntu, Python 3.12), the
#               tests of the converter library (test_oscal_conv_lib.py), the
#               attestation check end to end (test_attestation_binds.py),
#               a re-run of the IFA conversion and of the four shipped
#               catalogue conversions (AU.ISM, DE.BSI, US.CSF, US.SP800-53)
#               from their pinned sources, each of which must reproduce
#               what is committed, the nine catalogue converters on an
#               invented catalogue (test_convert_obligated_party.py), and a
#               run of the CR26 conversion on its pinned source, which is
#               downloaded and not committed: the bundle must validate and
#               the two coverage reports must be the committed ones
#   powershell  validate_core.ps1, the twin, on WINDOWS POWERSHELL 5.1
#               (windows-latest; `shell: powershell` is 5.1, `pwsh` would be 7),
#               after .github/scripts/lint-twin.ps1 has read its source: no
#               PowerShell operator may compare two strings (backlog #58);
#               then the attestation check end to end, on changed bundles
#   app         the JavaScript port in jascon-app/ against the same vectors
#   browser     the app's pages, the pack builder and the reader
#               (one-page-apps/) in Chromium, driven by Playwright, their
#               output held to the reference validator
#
# Each job fails unless its validator ends ALL GREEN. The counts are written
# to the job summary, so a run is a dated record of what passed where
# (specification IV.5b item 3: the second implementation).
name: Validators

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "jascon/**"
      - "converted_examples/**"
      - "jascon-app/**"
      - "one-page-apps/**"
      - ".gitattributes"
      - ".github/workflows/validators.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "jascon/**"
      - "converted_examples/**"
      - "jascon-app/**"
      - "one-page-apps/**"
      - ".gitattributes"
      - ".github/workflows/validators.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the validator's one dependency
        run: pip install jsonschema
      - name: validate_core.py
        run: |
          set -o pipefail
          python jascon/scripts/validate_core.py | tee run.log
      - name: Converter library (the value-level measurement of the coverage reports)
        run: python jascon/scripts/test_oscal_conv_lib.py
      - name: attestation-binds on a bundle, end to end
        # The vectors hold the primitive. This holds what a vector cannot: that
        # the Attestation beside a manifest is found, typed and counted, and
        # that a bundle fails when a claimed Attestation does not bind.
        run: python jascon/scripts/test_attestation_binds.py
      - name: The example Attestation is what its folder says
        # It binds the digest of the example manifest and three example objects;
        # a change to any of them needs it issued again.
        run: python drafts/phase-d/attest_example.py --check
      - name: The IFA conversion is reproducible from its pinned sources
        # The bundle, the coverage reports and the ledger under
        # converted_examples/US.IFA-GoodRead are a record of one conversion.
        # They change only when somebody means to change them: the sources
        # are fetched at their pinned commit, checked against SOURCES.sha256,
        # converted again, and the result must be byte for byte what is
        # committed.
        run: |
          set -euo pipefail
          list=converted_examples/US.IFA-GoodRead/SOURCES.sha256
          base=$(sed -n 's/^# base: //p' "$list")
          mkdir -p sources/nist
          sed -n 's/^# path: //p' "$list" | while read -r p; do
            curl -sSfL --retry 3 -o "sources/nist/$(basename "$p")" "$base$p"
          done
          (cd sources/nist && sha256sum -c "$GITHUB_WORKSPACE/$list")
          python jascon/scripts/convert_ifa.py
          if [ -n "$(git status --porcelain -- converted_examples/US.IFA-GoodRead)" ]; then
            echo "convert_ifa.py no longer reproduces the committed conversion:"
            git --no-pager diff --stat -- converted_examples/US.IFA-GoodRead
            exit 1
          fi
      - name: The nine catalogue converters and whom their statements bind (invented catalogue)
        # Backlog #74. Each converter is run on a catalogue nobody published:
        # without --obligated-party it writes its own party and reports it as
        # its default, with it the caller's, and a party the source states
        # stays the source's. Needs no source file.
        run: python jascon/scripts/test_convert_obligated_party.py
      - name: The four catalogue conversions are reproducible from their pinned sources
        # AU.ISM, DE.BSI, US.CSF and US.SP800-53, held as the IFA conversion is
        # held above: each source is fetched at its pinned tag or commit and
        # checked against the SOURCES.sha256 of its folder, converted again,
        # and the bundle and the two coverage reports must be byte for byte
        # what is committed. This is where "without an argument a converter
        # writes what it wrote before" is held (backlog #74).
        #
        # The SP 800-53 report counts the citations of its controls in every
        # corpus under converted_examples/. The count is the committed one only
        # while that folder holds what is committed and nothing else, so the
        # step says so first, in its own words, if another step has left a
        # bundle there.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- converted_examples)" ]; then
            echo "converted_examples/ is not as committed before the conversions are run again:"
            git status --porcelain -- converted_examples
            exit 1
          fi
          while read -r corpus converter; do
            bash .github/scripts/fetch-pinned-sources.sh "converted_examples/$corpus/SOURCES.sha256"
            python "jascon/scripts/$converter"
            if [ -n "$(git status --porcelain -- "converted_examples/$corpus")" ]; then
              echo "$converter no longer reproduces the committed conversion:"
              git --no-pager diff --stat -- "converted_examples/$corpus"
              git status --porcelain -- "converted_examples/$corpus"
              exit 1
            fi
          done <<'EOF'
          AU.ISM convert_ism.py
          DE.BSI convert_bsi.py
          US.CSF convert_csf.py
          US.SP800-53 convert_nist.py
          EOF
      - name: The CR26 conversion runs on its pinned source and reproduces its coverage reports
        # FedRAMP's rules file is not redistributed (converted_examples/
        # FedRAMP-CR26/NOT-REDISTRIBUTED.md): neither the source nor the
        # bundle is in the repository, and the two coverage reports are the
        # record of the conversion. The source is fetched at the publisher's
        # tag, checked against SOURCES.sha256 and converted into a temporary
        # directory. The converter must exit 0, which it does only when
        # every source leaf has a declared destination; the reference
        # validator must pass the bundle; and the two reports must be byte
        # for byte what is committed. They state the digest of the bundle's
        # manifest, so a bundle that differs in one byte fails here too.
        # The step writes the downloaded file under the git-ignored sources/
        # and a log beside run.log, nothing into the conversion's folder,
        # and it commits nothing. Last, the converter's own test.
        run: |
          set -euo pipefail
          dir=converted_examples/FedRAMP-CR26
          list=$dir/SOURCES.sha256
          base=$(sed -n 's/^# base: //p' "$list")
          path=$(sed -n 's/^# path: //p' "$list")
          name=$(awk '!/^#/ && NF == 2 { print $2 }' "$list")
          mkdir -p sources
          curl -sSfL --retry 3 -o "sources/$name" "$base$path"
          (cd sources && sha256sum -c "$GITHUB_WORKSPACE/$list")
          out=$(mktemp -d)
          python jascon/scripts/convert_cr26.py --out "$out"
          python jascon/scripts/validate_core.py "$out/cr26-core-bundle" | tee cr26.log
          for f in cr26-coverage-report.md cr26-coverage-report.json; do
            if ! cmp "$out/$f" "$dir/$f"; then
              echo "convert_cr26.py no longer reproduces the committed $f:"
              diff "$dir/$f" "$out/$f" | head -40 || true
              exit 1
            fi
          done
          if [ -n "$(git status --porcelain -- "$dir")" ]; then
            echo "the run wrote into the checkout:"
            git status --porcelain -- "$dir"
            exit 1
          fi
          # What the checks above cannot show: that the values stand where
          # the report declares them, what each argument does, and that the
          # run fails on a source it does not cover.
          python jascon/scripts/test_convert_cr26.py
      - name: Summary
        if: always()
        run: |
          {
            echo '### validate_core.py'
            echo '```'
            grep -E '^  [a-z-]+: [0-9]+ pass|: [0-9]+ pass, [0-9]+ fail|^ALL GREEN|FAILURES' run.log | cut -c1-160
            echo '```'
            if [ -f cr26.log ]; then
              echo '### validate_core.py on the CR26 bundle, converted from the pinned source'
              echo '```'
              grep -E 'cr26-core-bundle: [0-9]+ pass, [0-9]+ fail|^ALL GREEN|FAILURES' cr26.log | sed 's#^.*/cr26-core-bundle:#  cr26-core-bundle:#' | cut -c1-160
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  powershell:
    name: PowerShell twin (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion.ToString()
          Write-Host "Windows PowerShell $v, edition $($PSVersionTable.PSEdition)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host 'not Windows PowerShell 5.x'; exit 1 }
      - name: No operator compares two strings (lint-twin.ps1)
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .github\scripts\lint-twin.ps1
          exit $LASTEXITCODE
      - name: validate_core.ps1
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File jascon\scripts\validate_core.ps1 | Tee-Object -FilePath run.log
          exit $LASTEXITCODE
      - name: attestation-binds on a bundle, end to end, with the twin
        # The same nine changed copies the reference is run on, in one run of
        # the twin: every repository bundle is a Full Match, so the lines for a
        # Semantic Match, for an Attestation that does not bind and for a
        # failure are printed on Windows PowerShell 5.1 only here.
        shell: powershell
        run: |
          $env:JASCON_TWIN = 'powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File jascon\scripts\validate_core.ps1'
          python jascon\scripts\test_attestation_binds.py
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion.ToString()
          $lines = @("### validate_core.ps1 on Windows PowerShell $v", '```')
          if (Test-Path run.log) {
            $lines += Get-Content run.log | Where-Object { $_ -match ': \d+ pass, \d+ fail|^ALL GREEN|FAILURES|wall-clock' } | ForEach-Object { if ($_.Length -gt 160) { $_.Substring(0, 160) } else { $_ } }
          }
          $lines += '```'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  app:
    name: JavaScript port (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generated files are current
        run: |
          node jascon-app/tools/gen-schema.mjs --check
          node jascon-app/tools/gen-docs.mjs --check
          node jascon-app/tools/check-i18n.mjs
          node one-page-apps/tools/sync-inlined.mjs --check
      - name: Test suite
        run: node --test "jascon-app/tests/*.test.mjs"

  browser:
    name: Pages in a browser (app, pack builder and reader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The validator's one dependency, Playwright and Chromium
        run: |
          pip install jsonschema
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node --test jascon-app/tests/pages.test.mjs "one-page-apps/tests/*.test.mjs"
